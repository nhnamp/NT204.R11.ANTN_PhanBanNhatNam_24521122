<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" width="1200" height="910" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Architecture of the IDS</title>
<desc id="d">Three sources feed one loop. Packets go through Pipeline.process to an event. The Enricher then runs the Decoder, the Preprocessor, and the Flow Tracker. Two writers save the events and the flows.</desc>
<defs>
<marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1e1e1e"/></marker>
<marker id="head-f59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker>
</defs>
<rect width="1200" height="910" fill="#ffffff"/>
<g fill="#1e1e1e">
<rect x="20" y="20" width="340" height="90" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="190.0" y="59.5" text-anchor="middle" font-size="18">Live capture (--interface)</text>
<text x="190.0" y="82.5" text-anchor="middle" font-size="18">LiveSource: sniff in a thread</text>
<rect x="400" y="20" width="340" height="90" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="570.0" y="59.5" text-anchor="middle" font-size="18">PCAP import (--pcap)</text>
<text x="570.0" y="82.5" text-anchor="middle" font-size="18">PcapSource: one packet at a time</text>
<rect x="840" y="20" width="340" height="90" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
<text x="1010.0" y="48.0" text-anchor="middle" font-size="18">Events file (--events)</text>
<text x="1010.0" y="71.0" text-anchor="middle" font-size="18">EventFileSource: one JSON</text>
<text x="1010.0" y="94.0" text-anchor="middle" font-size="18">object for each line, guarded</text>
<line x1="190" y1="110" x2="190" y2="168" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-1e1e1e)"/>
<line x1="570" y1="110" x2="570" y2="168" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-1e1e1e)"/>
<rect x="20" y="170" width="740" height="250" rx="12" fill="#dbe4ff" fill-opacity="0.5" stroke="#4a9eed" stroke-width="1"/>
<text x="40" y="200" font-size="20" font-weight="600" fill="#1e3a8a">Pipeline.process(packet) -&gt; Event</text>
<rect x="30" y="230" width="345" height="50" rx="12" fill="#ffffff" stroke="#4a9eed" stroke-width="2"/>
<text x="202.5" y="261.0" text-anchor="middle" font-size="18">parse_ipv4 -&gt; network</text>
<rect x="395" y="230" width="345" height="50" rx="12" fill="#ffffff" stroke="#4a9eed" stroke-width="2"/>
<text x="567.5" y="261.0" text-anchor="middle" font-size="18">parse_transport -&gt; transport, payload</text>
<rect x="30" y="295" width="710" height="50" rx="12" fill="#ffffff" stroke="#4a9eed" stroke-width="2"/>
<text x="385.0" y="326.0" text-anchor="middle" font-size="18">detect_app_protocol -&gt; app_protocol, detection</text>
<rect x="30" y="360" width="345" height="50" rx="12" fill="#ffffff" stroke="#4a9eed" stroke-width="2"/>
<text x="202.5" y="391.0" text-anchor="middle" font-size="18">parse_http / dns / smtp -&gt; application</text>
<rect x="395" y="360" width="345" height="50" rx="12" fill="#ffffff" stroke="#4a9eed" stroke-width="2"/>
<text x="567.5" y="391.0" text-anchor="middle" font-size="18">errors and status -&gt; errors, status</text>
<line x1="390" y1="420" x2="390" y2="498" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-1e1e1e)"/>
<text x="405" y="455" font-size="18" fill="#1e1e1e">event.to_dict()</text>
<line x1="1010" y1="110" x2="1010" y2="498" stroke="#f59e0b" stroke-width="2" marker-end="url(#head-f59e0b)"/>
<text x="1025" y="290" font-size="18" fill="#b45309">records,</text>
<text x="1025" y="313" font-size="18" fill="#b45309">no packet</text>
<rect x="20" y="500" width="1160" height="240" rx="12" fill="#e5dbff" fill-opacity="0.5" stroke="#8b5cf6" stroke-width="1"/>
<text x="40" y="530" font-size="20" font-weight="600" fill="#5b21b6">Enricher.process(record): one guard for each stage</text>
<rect x="40" y="570" width="255" height="140" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
<text x="167.5" y="623.0" text-anchor="middle" font-size="18">0. Remove old</text>
<text x="167.5" y="646.0" text-anchor="middle" font-size="18">enrichment fields</text>
<text x="167.5" y="669.0" text-anchor="middle" font-size="18">(replay rule)</text>
<rect x="330" y="570" width="255" height="140" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
<text x="457.5" y="611.5" text-anchor="middle" font-size="18">1. Decoder</text>
<text x="457.5" y="634.5" text-anchor="middle" font-size="18">decode_record</text>
<text x="457.5" y="657.5" text-anchor="middle" font-size="18">-&gt; decode_status,</text>
<text x="457.5" y="680.5" text-anchor="middle" font-size="18">decoded</text>
<rect x="620" y="570" width="255" height="140" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
<text x="747.5" y="600.0" text-anchor="middle" font-size="18">2. Preprocessor</text>
<text x="747.5" y="623.0" text-anchor="middle" font-size="18">preprocess_record</text>
<text x="747.5" y="646.0" text-anchor="middle" font-size="18">-&gt; preprocess_status,</text>
<text x="747.5" y="669.0" text-anchor="middle" font-size="18">processing_action,</text>
<text x="747.5" y="692.0" text-anchor="middle" font-size="18">reason, normalized</text>
<rect x="910" y="570" width="255" height="140" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
<text x="1037.5" y="600.0" text-anchor="middle" font-size="18">3. Flow Tracker</text>
<text x="1037.5" y="623.0" text-anchor="middle" font-size="18">FlowTracker.update</text>
<text x="1037.5" y="646.0" text-anchor="middle" font-size="18">-&gt; flow_id, direction</text>
<text x="1037.5" y="669.0" text-anchor="middle" font-size="18">(only when action</text>
<text x="1037.5" y="692.0" text-anchor="middle" font-size="18">is keep)</text>
<line x1="295" y1="640" x2="328" y2="640" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-1e1e1e)"/>
<line x1="585" y1="640" x2="618" y2="640" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-1e1e1e)"/>
<line x1="875" y1="640" x2="908" y2="640" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-1e1e1e)"/>
<line x1="370" y1="740" x2="370" y2="808" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-1e1e1e)"/>
<line x1="830" y1="740" x2="830" y2="808" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head-1e1e1e)"/>
<rect x="160" y="810" width="420" height="80" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="370.0" y="844.5" text-anchor="middle" font-size="18">JsonLinesWriter (--output)</text>
<text x="370.0" y="867.5" text-anchor="middle" font-size="18">one line for each record</text>
<rect x="620" y="810" width="420" height="80" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="830.0" y="844.5" text-anchor="middle" font-size="18">JsonLinesWriter (--flows-output)</text>
<text x="830.0" y="867.5" text-anchor="middle" font-size="18">one line for each flow that left</text>
</g>
</svg>
